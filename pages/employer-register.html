<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVConnect | İşveren Kayıt</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-content">
        <a class="brand" href="../index.html">
          <img class="brand-logo" src="../assets/img/logo-placeholder.webp" alt="CVConnect Logo" />
          <span>CVConnect</span>
        </a>
        <nav class="nav">
          <a data-nav href="../index.html">Ana Sayfa</a>
          <a data-nav href="candidate-register.html">İş Arayan Kayıt</a>
          <a data-nav href="employer-register.html">İşveren Kayıt</a>
          <a data-nav href="candidate-search.html">Çalışan Ara</a>
          <a data-nav href="jobs.html">İlanlar</a>
          <a data-nav href="inbox.html">Mesajlar</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="page-head">
        <h1 class="page-title">İşveren ve Pozisyon Kaydı</h1>
        <p class="lead">Şirket bilgisi, iletişim kişisi ve açık rol detaylarını tek formda girin.</p>
      </section>

      <section class="card">
        <form id="employer-form">
          <div class="form-grid">
            <label>Şirket Adı<input name="company" required /></label>
            <label>İletişim Yetkilisi<input name="contactName" required /></label>
            <label>E-posta<input type="email" name="email" required /></label>
            <label>Telefon<input name="phone" required /></label>
            <label>Sektör<input name="sector" required /></label>
            <label>Şehir<input name="location" required /></label>
            <label>Şifre<input type="password" name="password" required /></label>
          </div>
          <label>Şirket Hakkında<textarea name="about" required></textarea></label>
          <div class="form-grid">
            <label>Pozisyon Adı<input name="positionTitle" required /></label>
            <label>Pozisyon Tipi<select name="positionType"><option>Tam Zamanlı</option><option>Yarı Zamanlı</option><option>Uzaktan</option><option>Staj</option></select></label>
            <label>Seviye<input name="positionLevel" placeholder="Junior / Mid / Senior" required /></label>
            <label>Pozisyon Açıklaması<textarea name="positionDescription" required></textarea></label>
          </div>
          <button class="btn btn-primary" type="submit">İşveren Kaydını Oluştur</button>
          <div id="employer-feedback" class="success hidden"></div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="container">CVConnect</div>
    </footer>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/employer-register.js"></script>
  </body>
  </html>
