<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVConnect | Hoş Geldiniz</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .welcome-body {
        background: radial-gradient(circle at 50% 50%, rgba(27, 160, 225, 0.08), transparent 80%), #f8fbff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
      }
      .welcome-box {
        background: #ffffff;
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 46, 82, 0.1);
        border: 1px solid #e2edf8;
        max-width: 800px;
        width: 100%;
      }
      .welcome-title {
        font-size: 2.5rem;
        color: #102b4c;
        margin-bottom: 10px;
      }
      .welcome-subtitle {
        color: #5f6e8c;
        font-size: 1.1rem;
        margin-bottom: 40px;
      }
      .welcome-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }
      @media (max-width: 600px) {
        .welcome-options { grid-template-columns: 1fr; }
      }
      .option-card {
        padding: 30px;
        border-radius: 16px;
        border: 2px solid transparent;
        transition: all 0.3s ease;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .option-candidate {
        background: #f4f9ff;
        border-color: #c9e1fa;
        color: #1ba0e1;
      }
      .option-candidate:hover {
        background: #eaf4ff;
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(27, 160, 225, 0.2);
      }
      .option-employer {
        background: #fdf5f9;
        border-color: #f3d6e5;
        color: #6f54db;
      }
      .option-employer:hover {
        background: #faf0f6;
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(111, 84, 219, 0.2);
      }
      .option-card h3 { margin: 0; font-size: 1.5rem; }
      .option-card p { margin: 0; color: #5f6e8c; font-size: 0.95rem; }
      .login-link {
        color: #1ba0e1;
        font-weight: bold;
        text-decoration: underline;
        margin-top: 20px;
        display: inline-block;
      }
    </style>
  </head>
  <body class="welcome-body">
    <div class="welcome-box">
      <img src="../assets/img/logo-placeholder.webp" alt="CVConnect Logo" style="width: 80px; height: 80px; border-radius: 20px; margin-bottom: 20px; object-fit: cover; box-shadow: 0 10px 24px rgba(12, 67, 128, 0.24);" />
      <h1 class="welcome-title">CVConnect'e Hoş Geldiniz</h1>
      <p class="welcome-subtitle">Platformu görüntülemek için lütfen kimliğinizi seçin.</p>
      
      <div class="welcome-options">
        <a href="candidate-register.html" class="option-card option-candidate">
          <h3>İş Arıyorum</h3>
          <p>Yeteneklerinizi sergileyin ve hayalinizdeki işi bulun.</p>
        </a>
        <a href="employer-register.html" class="option-card option-employer">
          <h3>İşverenim</h3>
          <p>Şirket profilinizi oluşturun ve en iyi yetenekleri keşfedin.</p>
        </a>
      </div>

      <div>
        <span style="color: #5f6e8c;">Zaten bir hesabınız var mı?</span>
        <a href="login.html" class="login-link">Hemen Giriş Yap</a>
      </div>
    </div>

    
    <script src="../assets/js/storage.js"></script>
    <script>

      document.addEventListener("DOMContentLoaded", () => {
        if (CVConnectStore.getCurrentUser()) {
          window.location.href = "../index.html";
        }
      });
    </script>
  </body>
</html>
